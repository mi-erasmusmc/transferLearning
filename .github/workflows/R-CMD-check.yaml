name: R-CMD-check
on:
  workflow_dispatch:
  push:
    paths: ['R/**', 'tests/**', 'DESCRIPTION', 'inst/**', 'man/**', 'vignettes/**', '.github/workflows/**']
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OHDSI/PatientLevelPrediction
          ref: f2cef128f1bfdf69295f2d5ab0eb911d5103a93a
          path: upstream-plp
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: upstream-plp
          dependencies: NA
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install pinned PLP develop
        shell: bash
        run: R CMD INSTALL upstream-plp
      - name: Remove upstream checkout from package tree
        shell: bash
        run: rm -rf upstream-plp
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
